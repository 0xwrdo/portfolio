<body>
<nav class="rk-nav">
  <a href="index.html" class="rk-logo">Raunak Kushwaha</a>
  <ul class="rk-links">
    <li><a href="index.html#work">Work</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>
<div style="min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem">
  <div>
    <div style="font-family:var(--display);font-size:clamp(5rem,20vw,12rem);font-weight:800;color:var(--orange);line-height:1;margin-bottom:1rem">404</div>
    <p style="color:var(--muted);margin-bottom:2rem;font-size:1rem">This page doesn't exist.</p>
    <a href="index.html" class="btn-orange">← Go Home</a>
  </div>
</div>
<footer class="rk-footer">
  <span>© <span class="yr"></span> Raunak Kushwaha — Kathmandu, Nepal 🇳🇵</span>

  </div>
</footer>
<script>
(function(){
  const nav=document.getElementById('rkNav');
  window.addEventListener('scroll',()=>nav&&nav.classList.toggle('scrolled',scrollY>30),{passive:true});
  if(nav) nav.classList.toggle('scrolled',scrollY>30);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
  document.querySelectorAll('.yr').forEach(el=>el.textContent=new Date().getFullYear());
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'});});
  });
})();
</script>
</body>
</html>
